<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUARED</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        img { max-width: 300px; margin: 20px 0; border: 1px solid #ccc; }
        .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
    </style>
</head>
<body>

    <h2>Image Processor</h2>
    <input type="file" id="upload" accept="image/*">
    <img id="preview" src="" alt="Preview">
    
    <div class="controls">
        <input type="text" id="fileName" placeholder="Enter file name">
        <button id="btnSquare">Square (Best Fit)</button>
        <button id="btn420">Resize to 420x420</button>
        <hr>
        <button id="saveBtn" disabled>Save PNG</button>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const upload = document.getElementById('upload');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const saveBtn = document.getElementById('saveBtn');
        const fileNameInput = document.getElementById('fileName');
        const btnSquare = document.getElementById('btnSquare');
        const btn420 = document.getElementById('btn420');
        let img = new Image();

        upload.addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => { preview.src = img.src; };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        btnSquare.addEventListener('click', () => {
            const size = Math.max(img.width, img.height);
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, size, size);
            ctx.drawImage(img, (size - img.width) / 2, (size - img.height) / 2);
            saveBtn.disabled = false;
        });

        btn420.addEventListener('click', () => {
            canvas.width = 420;
            canvas.height = 420;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 420, 420);
            saveBtn.disabled = false;
        });

        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = (fileNameInput.value || 'image') + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
