<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square Resizer</title>
</head>
<body>

    <input type="file" id="upload" accept="image/*">
    <br><br>
    <input type="text" id="fileName" placeholder="Enter file name">
    <button id="saveBtn">Save as PNG</button>
    <br><br>
    <img id="preview" style="max-width:300px;">
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const upload = document.getElementById('upload');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const saveBtn = document.getElementById('saveBtn');
        const fileNameInput = document.getElementById('fileName');
        let img = new Image();

        upload.addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => {
                    // Resizing to square: forcing width and height to match 
                    // This will change the aspect ratio to force a square
                    canvas.width = 1000;
                    canvas.height = 1000;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 1000, 1000);
                    preview.src = canvas.toDataURL('image/png');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = (fileNameInput.value || 'image') + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
