<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Square Resizer</title>
</head>
<body>

    <input type="file" id="upload" accept="image/*">
    <br>
    <img id="preview" style="max-width:300px;">
    <br>
    <input type="text" id="fileName" placeholder="File Name">
    <br>
    <button id="btnSquare">Make Square</button>
    <button id="btn420">Make 420x420 Square</button>
    <button id="saveBtn" disabled>Save</button>
    
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const upload = document.getElementById('upload');
        const preview = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const saveBtn = document.getElementById('saveBtn');
        const fileName = document.getElementById('fileName');
        const btnSquare = document.getElementById('btnSquare');
        const btn420 = document.getElementById('btn420');
        let img = new Image();

        upload.addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => { preview.src = img.src; };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        // Option 1: Makes it a square (stretches to 500x500)
        btnSquare.addEventListener('click', () => {
            canvas.width = 500;
            canvas.height = 500;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 500, 500);
            saveBtn.disabled = false;
        });

        // Option 2: Makes it a 420x420 square (stretches to 420x420)
        btn420.addEventListener('click', () => {
            canvas.width = 420;
            canvas.height = 420;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 420, 420);
            saveBtn.disabled = false;
        });

        saveBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = (fileName.value || 'image') + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
